<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คชื่อเข้าเรียน - นักศึกษา</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">ลงชื่อเข้าเรียน</h1>
            <a href="index.html" class="text-sm text-blue-600 hover:underline">← กลับหน้าหลัก</a>
        </div>

        <form id="attendanceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสนักศึกษา</label>
                <input type="text" id="studentId" required placeholder="เช่น 6539010001" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ -นามสกุล</label>
                <input type="text" id="studentName" required placeholder="เช่น นายชยกร สวัสดี" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- กล้องถ่ายรูป -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ถ่ายภาพยืนยันตัวตน</label>
                <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="photoPreview" class="hidden absolute inset-0 w-full h-full object-cover">
                </div>
                <button type="button" id="captureBtn" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 rounded-xl text-sm transition">ถ่ายภาพ</button>
            </div>

            <!-- ข้อมูลพิกัด GPS -->
            <div class="bg-blue-50 p-3 rounded-xl text-xs text-blue-800 flex justify-between items-center">
                <span id="locationStatus">📍 กำลังดึงพิกัดตำแหน่ง GPS...</span>
                <button type="button" onclick="getLocation()" class="underline font-semibold">รีเฟรชพิกัด</button>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
                ยืนยันการเช็คชื่อ
            </button>
        </form>
        <div id="responseMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const captureBtn = document.getElementById('captureBtn');
        let capturedImage = null;
        let latitude = null;
        let longitude = null;

        // เปิดกล้อง WebRTC
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert('ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้อง'); });

        // ถ่ายภาพจาก Video
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImage = canvas.toDataURL('image/jpeg');
            photoPreview.src = capturedImage;
            photoPreview.classList.remove('hidden');
            captureBtn.textContent = 'ถ่ายภาพใหม่อีกครั้ง';
        });

        // ดึงพิกัด GPS
        function getLocation() {
            const status = document.getElementById('locationStatus');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        latitude = position.coords.latitude;
                        longitude = position.coords.longitude;
                        status.textContent = `📍 พิกัด: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                    },
                    error => { status.textContent = '❌ ไม่สามารถดึงพิกัด GPS ได้'; }
                );
            } else {
                status.textContent = '❌ เบราว์เซอร์ไม่รองรับ GPS';
            }
        }
        getLocation();

        // ส่งฟอร์มเช็คชื่อ
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!capturedImage) {
                alert('กรุณาถ่ายภาพยืนยันตัวตนก่อนส่งข้อมูล');
                return;
            }

            const data = {
                studentId: document.getElementById('studentId').value,
                studentName: document.getElementById('studentName').value,
                latitude,
                longitude,
                photo: capturedImage
            };

            const res = await fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            const msg = document.getElementById('responseMessage');
            if (result.success) {
                msg.className = 'mt-4 text-center text-sm font-medium text-green-600';
                msg.textContent = result.message;
                setTimeout(() => location.reload(), 2000);
            } else {
                msg.className = 'mt-4 text-center text-sm font-medium text-red-600';
                msg.textContent = result.message;
            }
        });
    </script>
</body>
</html>
