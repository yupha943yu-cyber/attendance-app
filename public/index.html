<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkCheck - ระบบเช็คชื่อเข้าเรียนออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-3xl w-full bg-white rounded-3xl shadow-md border border-slate-200 p-6 sm:p-8">
    <div class="text-center mb-8">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-2">
        Photo + GPS + Calendar History
      </span>
      <h1 class="text-3xl font-bold text-slate-800">WorkCheck</h1>
      <p class="text-slate-500 mt-1">ระบบเช็คชื่อเข้าเรียนออนไลน์และตรวจสอบประวัติย้อนหลัง</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <a href="/student.html"
        class="group block p-5 rounded-2xl border border-indigo-200 bg-indigo-50/50 hover:bg-indigo-600 transition">
        <div class="text-2xl mb-2">🎓</div>
        <h2 class="font-bold text-slate-800 group-hover:text-white text-lg">นักศึกษา</h2>
        <p class="text-xs text-slate-600 group-hover:text-indigo-100 mt-1">เช็คชื่อตามวันปัจจุบัน ถ่ายรูป และแนบพิกัด GPS</p>
      </a>

      <a href="/parent.html"
        class="group block p-5 rounded-2xl border border-emerald-200 bg-emerald-50/50 hover:bg-emerald-600 transition">
        <div class="text-2xl mb-2">👨‍👩‍👧</div>
        <h2 class="font-bold text-slate-800 group-hover:text-white text-lg">ผู้ปกครอง</h2>
        <p class="text-xs text-slate-600 group-hover:text-emerald-100 mt-1">ค้นหาประวัติย้อนหลังตามปฏิทินและรหัสนักศึกษา</p>
      </a>

      <a href="/teacher.html"
        class="group block p-5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-800 transition">
        <div class="text-2xl mb-2">👩‍🏫</div>
        <h2 class="font-bold text-slate-800 group-hover:text-white text-lg">อาจารย์ผู้สอน</h2>
        <p class="text-xs text-slate-600 group-hover:text-slate-200 mt-1">ดูข้อมูลรายวัน/ย้อนหลังผ่านปฏิทินและจัดการรายชื่อ</p>
      </a>
    </div>
  </div>
</body>
</html>
