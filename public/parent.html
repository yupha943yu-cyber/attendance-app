<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบประวัติการเช็คชื่อ - ผู้ปกครอง</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">ระบบตรวจสอบสำหรับผู้ปกครอง</h1>
                <p class="text-gray-500 text-sm">ค้นหาประวัติการเข้าเรียนของนักศึกษา</p>
            </div>
            <a href="index.html" class="text-sm text-blue-600 hover:underline">← กลับหน้าหลัก</a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100 mb-6">
            <div class="flex gap-2">
                <input type="text" id="searchId" placeholder="กรอกรหัสนักศึกษา (เช่น 6539010001)" class="flex-1 px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                <button onclick="searchStudent()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2 rounded-xl text-sm transition shadow-md">ค้นหา</button>
            </div>
        </div>

        <div id="resultContainer" class="space-y-4">
            <div class="bg-white rounded-2xl shadow-xl p-6 text-center text-gray-400 border border-gray-100">
                กรุณากรอกรหัสนักศึกษาเพื่อตรวจสอบข้อมูล
            </div>
        </div>
    </div>

    <script>
        async function searchStudent() {
            const query = document.getElementById('searchId').value.trim();
            const container = document.getElementById('resultContainer');

            if (!query) {
                alert('กรุณากรอกรหัสนักศึกษาก่อนค้นหา');
                return;
            }

            try {
                const res = await fetch('/api/attendance');
                const records = await res.json();
                const filtered = records.filter(r => r.studentId.includes(query));

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="bg-white rounded-2xl shadow-xl p-6 text-center text-red-500 border border-gray-100">ไม่พบประวัติการเช็คชื่อของรหัสดังกล่าว</div>`;
                    return;
                }

                container.innerHTML = filtered.map(r => `
                    <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100 flex items-center gap-4">
                        <img src="${r.photo}" class="w-20 h-20 object-cover rounded-xl shadow-sm border">
                        <div class="flex-1">
                            <h3 class="font-bold text-lg text-gray-800">${r.studentName}</h3>
                            <p class="text-sm text-gray-600">รหัสนักศึกษา: <span class="font-semibold">${r.studentId}</span></p>
                            <p class="text-xs text-gray-500 mt-1">📍 พิกัด: ${r.latitude}, ${r.longitude}</p>
                            <p class="text-xs text-emerald-600 font-semibold mt-1">✔ เวลาเช็คชื่อ: ${r.timestamp}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
