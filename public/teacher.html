<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบจัดการสำหรับอาจารย์ - WorkCheck</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
  <div class="max-w-5xl mx-auto p-4 sm:p-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">ระบบตรวจสอบสำหรับอาจารย์ผู้สอน</h1>
        <p class="text-sm text-slate-500">ตรวจสอบรายการเข้าเรียนรายวันและย้อนหลังตามปฏิทิน</p>
      </div>
      <a href="/" class="text-sm bg-white border border-slate-200 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100">หน้าหลัก</a>
    </div>

    <div id="loginBox" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-10">
      <h2 class="text-lg font-bold text-slate-800 mb-2">ยืนยันตัวตนอาจารย์ผู้สอน</h2>
      <p class="text-sm text-slate-500 mb-4">กรุณากรอกรหัสผ่านเพื่อเข้าถึงข้อมูลการเช็คชื่อ</p>
      <input type="password" id="teacherPassword" placeholder="รหัสผ่านอาจารย์"
        onkeydown="if(event.key === 'Enter') loginTeacher()"
        class="w-full px-3 py-2.5 border border-slate-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button onclick="loginTeacher()"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition">
        เข้าสู่ระบบ
      </button>
    </div>

    <div id="dashboardBox" class="hidden space-y-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">📅 เลือกวันที่จากปฏิทิน</label>
            <input type="date" id="calendarDate" onchange="fetchRecords()"
              class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">🔍 ค้นหารหัสนักศึกษา</label>
            <input type="text" id="searchStudentId" placeholder="เช่น 67219100051" oninput="fetchRecords()"
              class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div class="flex gap-2">
            <button onclick="setToday()"
              class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-2 px-3 rounded-xl text-sm transition">
              วันนี้
            </button>
            <button onclick="showAllDates()"
              class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-xl text-sm transition">
              ดูย้อนหลังทั้งหมด
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between bg-indigo-600 text-white px-5 py-3.5 rounded-2xl shadow-sm">
        <span id="statusTitle" class="font-medium text-sm sm:text-base">รายการเช็คชื่อ</span>
        <span id="totalCount" class="text-lg font-bold">0 รายการ</span>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
              <th class="p-4">ภาพถ่าย</th>
              <th class="p-4">วันที่ / เวลา</th>
              <th class="p-4">รหัสนักศึกษา</th>
              <th class="p-4">ชื่อ-นามสกุล</th>
              <th class="p-4">พิกัด GPS</th>
              <th class="p-4 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let savedPassword = '';

    function getTodayThai() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
    }

    function setToday() {
      document.getElementById('calendarDate').value = getTodayThai();
      fetchRecords();
    }

    function showAllDates() {
      document.getElementById('calendarDate').value = '';
      fetchRecords();
    }

    async function loginTeacher() {
      const password = document.getElementById('teacherPassword').value;
      if (!password) return alert('กรุณากรอกรหัสผ่าน');

      savedPassword = password;
      document.getElementById('calendarDate').value = getTodayThai();
      const ok = await fetchRecords();
      if (ok) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboardBox').classList.remove('hidden');
      }
    }

    async function fetchRecords() {
      const date = document.getElementById('calendarDate').value;
      const studentId = document.getElementById('searchStudentId').value.trim();

      try {
        const res = await fetch('/api/teacher/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: savedPassword, date, studentId })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          alert(data.message || 'รหัสผ่านไม่ถูกต้องหรือเกิดข้อผิดพลาด');
          return false;
        }

        document.getElementById('statusTitle').textContent = date
          ? `รายการเช็คชื่อวันที่ ${date}`
          : 'รายการเช็คชื่อย้อนหลังทั้งหมด';
        document.getElementById('totalCount').textContent = `${data.records.length} รายการ`;

        const tbody = document.getElementById('recordsTableBody');
        if (data.records.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">ไม่พบข้อมูลการเช็คชื่อในช่วงเวลาที่เลือก</td></tr>`;
          return true;
        }

        tbody.innerHTML = data.records.map(r => `
          <tr class="hover:bg-slate-50">
            <td class="p-3">
              <img src="${r.photo}" alt="รูปถ่ายนักศึกษา" class="w-14 h-14 object-cover rounded-lg border border-slate-200 cursor-pointer"
                onclick="window.open('${r.photo}', '_blank')" title="คลิกเพื่อดูภาพขนาดเต็ม" />
            </td>
            <td class="p-3">
              <div class="font-medium text-slate-800">${r.date}</div>
              <div class="text-xs text-slate-500">${r.time}</div>
            </td>
            <td class="p-3 font-medium text-slate-700">${r.studentId}</td>
            <td class="p-3">
              <div class="text-slate-800">${r.fullName}</div>
              <div class="text-xs text-slate-500">${r.className || '-'}</div>
            </td>
            <td class="p-3">
              ${typeof r.latitude === 'number' && typeof r.longitude === 'number' ? `
                <a href="https://www.google.com/maps?q=${r.latitude},${r.longitude}" target="_blank" rel="noopener noreferrer"
                  class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg hover:bg-blue-100 inline-block">
                  📍 เปิดแผนที่
                </a>
              ` : '<span class="text-xs text-slate-400">ไม่ระบุ</span>'}
            </td>
            <td class="p-3 text-center">
              <button onclick="deleteRecord('${r.id}')" class="text-xs text-red-500 hover:underline">ลบ</button>
            </td>
          </tr>
        `).join('');

        return true;
      } catch (err) {
        alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        return false;
      }
    }

    async function deleteRecord(id) {
      if (!confirm('ยืนยันการลบรายการเช็คชื่อนี้?')) return;
      try {
        const res = await fetch(`/api/teacher/records/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: savedPassword })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          fetchRecords();
        } else {
          alert(data.message || 'ลบข้อมูลไม่สำเร็จ');
        }
      } catch (err) {
        alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
      }
    }
  </script>
</body>
</html>
