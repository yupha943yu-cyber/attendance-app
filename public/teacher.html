<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard อาจารย์ - ตรวจสอบรายชื่อ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-6">

    <!-- Modal ใส่รหัสผ่าน -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-100 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">🔒 กรุณายืนยันตัวตนผู้สอน</h2>
            <p class="text-gray-500 text-sm mb-6">โปรดใส่รหัสผ่านเพื่อเข้าสู่หน้าแดชบอร์ดอาจารย์</p>
            <form onsubmit="checkPassword(event)" class="space-y-4">
                <input type="password" id="teacherPassword" required placeholder="รหัสผ่าน (ค่าเริ่มต้น: admin1234)" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-gray-800 focus:outline-none text-center text-lg">
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3 rounded-xl transition shadow-md">เข้าสู่ระบบ</button>
            </form>
            <a href="index.html" class="block mt-4 text-sm text-gray-500 hover:underline">← กลับหน้าหลัก</a>
        </div>
    </div>

    <!-- เนื้อหาหลัก (ซ่อนไว้จนกว่าจะใส่รหัสผ่านถูกต้อง) -->
    <div id="mainContent" class="max-w-5xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">แดชบอร์ดตรวจสอบการเช็คชื่อ</h1>
                <p class="text-gray-500 text-sm">รายชื่อนักศึกษาที่ลงทะเบียนเรียนในระบบ</p>
            </div>
            <a href="index.html" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-100 shadow-sm">← หน้าหลัก</a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <span id="countText" class="font-semibold text-gray-700">จำนวนผู้เช็คชื่อ: 0 คน</span>
                <button onclick="clearData()" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-sm font-medium transition">ล้างข้อมูลทั้งหมด</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                            <th class="p-4">ภาพถ่าย</th>
                            <th class="p-4">รหัสนักศึกษา</th>
                            <th class="p-4">ชื่อ - นามสกุล</th>
                            <th class="p-4">พิกัด GPS</th>
                            <th class="p-4">เวลาที่เช็คชื่อ</th>
                        </tr>
                    </thead>
                    <tbody id="recordTable" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <tr><td colspan="5" class="p-6 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "admin1234"; // สามารถเปลี่ยนรหัสผ่านได้ที่นี่

        function checkPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('teacherPassword').value;
            if (pass === CORRECT_PASSWORD) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                fetchRecords();
                setInterval(fetchRecords, 5000);
            } else {
                alert('รหัสผ่านไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง');
            }
        }

        async function fetchRecords() {
            try {
                const res = await fetch('/api/attendance');
                const records = await res.json();
                const tbody = document.getElementById('recordTable');
                document.getElementById('countText').textContent = `จำนวนผู้เช็คชื่อ: ${records.length} คน`;

                if (records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">ยังไม่มีประวัติการเช็คชื่อ</td></tr>`;
                    return;
                }

                tbody.innerHTML = records.map(r => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4"><img src="${r.photo}" class="w-12 h-12 object-cover rounded-lg shadow-sm border"></td>
                        <td class="p-4 font-semibold">${r.studentId}</td>
                        <td class="p-4">${r.studentName}</td>
                        <td class="p-4 text-xs text-gray-500">${r.latitude}, ${r.longitude}</td>
                        <td class="p-4 text-xs text-gray-500">${r.timestamp}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function clearData() {
            if (confirm('คุณต้องการล้างข้อมูลประวัติการเช็คชื่อทั้งหมดใช่หรือไม่?')) {
                await fetch('/api/attendance', { method: 'DELETE' });
                fetchRecords();
            }
        }
    </script>
</body>
</html>
